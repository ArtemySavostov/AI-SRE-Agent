spring.application.name=sre-platform

# Container HTTP port; published host ports are configured by the infrastructure.
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}

# DB_HOST is the PostgreSQL service name on the shared Docker network.
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:sre_platform}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway uses the same datasource. Schema migrations belong to the application.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Private SSH keys live outside the database, API responses and Docker image.
sre.ssh.keys-directory=${SRE_SSH_KEYS_DIRECTORY:.local/ssh}
